name: Merge green Dependabot pull requests

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

# This is the only lane in this repository that can write to the protected
# branch, so its surface is deliberately minimal:
#
#   * it never checks out or executes pull-request code;
#   * it runs no actions at all, so nothing third-party executes with this token;
#   * it re-derives every guard from the workflow_run metadata itself rather than
#     trusting the review lane, so neither lane can widen the other;
#   * branch protection still decides. The merge request is refused unless the
#     required check passed and the branch is up to date, and the merge method is
#     squash because linear history is enforced;
#   * after landing, it explicitly dispatches CI on `main`. GitHub suppresses
#     ordinary push workflows for commits created with GITHUB_TOKEN, so this is
#     what gives the landed SHA its own deployable full-CI proof. Reruns recover
#     an already merged SHA and reuse any viable qualification run.
#
# Delegating this to Dependabot's own credentials was tried first and does not
# work: a `@dependabot` command from `github-actions[bot]` is ignored because that
# actor has no write access (author_association NONE), so the comment sat
# unacknowledged while PRs stayed open. See docs/ci-security.md.
permissions:
  actions: read
  contents: read

jobs:
  merge:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      # Landing the squash commit on the protected branch.
      contents: write
      # Reading the pull request and issuing its merge.
      pull-requests: write
      # Read the triggering run and dispatch post-merge CI on protected main.
      actions: write
    steps:
      - name: Merge the exact Dependabot revision CI tested
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail

          source_run=$(gh api "repos/${REPOSITORY}/actions/runs/${WORKFLOW_RUN_ID}")
          event=$(jq -r '.event' <<<"${source_run}")
          actor=$(jq -r '.actor.login // empty' <<<"${source_run}")
          source_repository=$(jq -r '.head_repository.full_name // empty' <<<"${source_run}")
          head_branch=$(jq -r '.head_branch' <<<"${source_run}")
          head_sha=$(jq -r '.head_sha' <<<"${source_run}")

          if [[ "${event}" != 'pull_request' ||
                "${actor}" != 'dependabot[bot]' ||
                "${source_repository}" != "${REPOSITORY}" ||
                "${head_branch}" != dependabot/* ]]; then
            echo 'Successful CI run is not a same-repository Dependabot PR; nothing is merged.'
            exit 0
          fi

          repository_owner=${REPOSITORY%%/*}
          pull_request_from_run=$(jq -r '.pull_requests[0].number // empty' <<<"${source_run}")
          if [[ "${pull_request_from_run}" =~ ^[0-9]+$ ]]; then
            pull_request_json=$(gh api "repos/${REPOSITORY}/pulls/${pull_request_from_run}")
          else
            # Older workflow_run payloads can omit pull_requests. Search all states
            # so a rerun after the merge can recover the already-landed revision.
            pull_request_json=$(gh api --method GET "repos/${REPOSITORY}/pulls" \
              -f state=all \
              -f "head=${repository_owner}:${head_branch}" \
              | jq -ec --arg sha "${head_sha}" '
                  [ .[]
                    | select(.user.login == "dependabot[bot]")
                    | select(.head.repo.full_name == .base.repo.full_name)
                    | select(.base.ref == "main")
                    | select(.head.sha == $sha)
                  ]
                  | if length == 1 then .[0]
                    else error("expected one Dependabot pull request at the CI-tested SHA")
                    end
                ')
          fi

          if ! jq -e \
            --arg repository "${REPOSITORY}" \
            --arg branch "${head_branch}" \
            --arg sha "${head_sha}" '
              .user.login == "dependabot[bot]" and
              .head.repo.full_name == $repository and
              .base.repo.full_name == $repository and
              .base.ref == "main" and
              .head.ref == $branch and
              .head.sha == $sha
            ' <<<"${pull_request_json}" >/dev/null; then
            echo 'Pull-request metadata no longer matches the qualified Dependabot revision.' >&2
            exit 1
          fi
          pull_request=$(jq -er '.number' <<<"${pull_request_json}")

          if [[ $(jq -r '.merged' <<<"${pull_request_json}") == 'true' ]]; then
            landed_sha=$(jq -er '
              .merge_commit_sha
              | select(type == "string" and test("^[0-9a-f]{40}$"))
            ' <<<"${pull_request_json}")
            echo "Recovering post-merge qualification for #${pull_request} at ${landed_sha}."
          elif [[ $(jq -r '.state' <<<"${pull_request_json}") == 'open' ]]; then
            # Bind the merge to the tested commit. If Dependabot force-pushes a
            # rebase between CI finishing and this request, the SHA no longer
            # matches and GitHub refuses rather than landing untested code.
            if merge_response=$(gh api --method PUT "repos/${REPOSITORY}/pulls/${pull_request}/merge" \
              -f "sha=${head_sha}" \
              -f merge_method=squash) &&
              landed_sha=$(jq -er '
                if .merged == true and (.sha | test("^[0-9a-f]{40}$"))
                then .sha
                else error("merge API declined the qualified revision")
                end
              ' <<<"${merge_response}"); then
              :
            else
              # The response can be lost after GitHub lands the merge. Re-read
              # the PR before treating this as normal strict-branch convergence.
              pull_request_json=$(gh api "repos/${REPOSITORY}/pulls/${pull_request}")
              if ! jq -e --arg sha "${head_sha}" '
                .merged == true and
                .head.sha == $sha and
                (.merge_commit_sha | type == "string" and test("^[0-9a-f]{40}$"))
              ' <<<"${pull_request_json}" >/dev/null; then
                echo "GitHub declined to merge #${pull_request} at ${head_sha}; leaving it for the next qualified revision."
                exit 0
              fi
              landed_sha=$(jq -er '.merge_commit_sha' <<<"${pull_request_json}")
            fi
          else
            echo "Dependabot pull request #${pull_request} is closed without a merge; nothing to qualify."
            exit 0
          fi

          main_sha=$(gh api "repos/${REPOSITORY}/git/ref/heads/main" --jq '.object.sha')
          echo "Qualified pull request #${pull_request}; protected main is ${main_sha}."

          # A rerun after a transient post-merge failure must be idempotent. A
          # queued/running exact-main proof, or an already successful one, owns
          # qualification; failed or cancelled attempts may be retried.
          qualification_list_ok=false
          for attempt in 1 2 3 4 5 6; do
            if qualification_list=$(timeout 10s gh run list --repo "${REPOSITORY}" --workflow CI --branch main --limit 50 \
              --json databaseId,headSha,status,conclusion,event,url,createdAt 2>/dev/null) &&
              qualification_run=$(jq -sc --arg sha "${landed_sha}" '
                  if length != 1 or (.[0] | type) != "array" then error("invalid run listing") else .[0] end
                  | map(if type == "object" and (.databaseId | type == "number" and . > 0 and floor == .) and
                      (.headSha | type == "string" and test("^[0-9a-f]{40}$")) and
                      (.status | type == "string") and (.event | type == "string") and
                      (.conclusion | type == "string" or type == "null") and
                      (.url | type == "string") and (.createdAt | type == "string")
                    then . else error("malformed run") end)
                  | [ .[]
                    | select(.headSha == $sha)
                    | select(.event == "push" or .event == "workflow_dispatch")
                    | select(
                        .status == "queued" or
                        .status == "in_progress" or
                        (.status == "completed" and .conclusion == "success")
                      )
                  ][0] // empty
                ' <<<"${qualification_list}" 2>/dev/null); then
              qualification_list_ok=true
              break
            fi
            if [[ "${attempt}" != '6' ]]; then sleep 2; fi
          done
          if [[ "${qualification_list_ok}" != 'true' ]]; then
            echo 'Cannot read existing CI qualification runs; no dispatch attempted.' >&2
            exit 1
          fi
          if [[ -n "${qualification_run}" ]]; then
            qualification_run_id=$(jq -r '.databaseId' <<<"${qualification_run}")
            qualification_url=$(jq -r '.url' <<<"${qualification_run}")
            echo "CI qualification ${qualification_run_id} already owns landed revision ${landed_sha}: ${qualification_url}"
            exit 0
          fi

          # GITHUB_TOKEN-created commits do not emit another push workflow run.
          # workflow_dispatch is the documented recursion-safe exception. The
          # API accepts a branch or tag ref, not a raw commit, so CI also receives
          # the landed SHA as a required input and fails before checkout unless
          # GitHub resolved `main` to that exact revision.
          if [[ "${main_sha}" == "${landed_sha}" ]]; then
            # Resolve the CI workflow identity independently of the POST result.
            workflow_id=$(gh api "repos/${REPOSITORY}/actions/workflows/ci.yml" \
              | jq -er '.id | select(type == "number" and . > 0 and floor == .) | tostring')
            [[ "${workflow_id}" =~ ^[1-9][0-9]*$ ]]
            dispatch_payload=$(jq -cn --arg expected_sha "${landed_sha}" \
              '{ref:"main", inputs:{expected_sha:$expected_sha}}')
            dispatch_started=$(date -u +%s)
            # One POST only: a nonzero exit can still mean GitHub created a run.
            dispatch_response=$(timeout 30s gh api --method POST \
              -H 'X-GitHub-Api-Version: 2026-03-10' \
              "repos/${REPOSITORY}/actions/workflows/ci.yml/dispatches" \
              --input - <<<"${dispatch_payload}" 2>/dev/null) || :
            dispatch_finished=$(date -u +%s)
            window_start=$((dispatch_started - 5))
            window_end=$((dispatch_finished + 30))
            created_since=$(date -u -d "@${window_start}" '+%Y-%m-%dT%H:%M:%SZ')
            dispatch_run_id=$(jq -ser '
              if length == 1 then .[0].workflow_run_id else null end
              | select(type == "number" and . > 0 and floor == .) | tostring
            ' <<<"${dispatch_response}" 2>/dev/null) || dispatch_run_id=''
            if [[ ! "${dispatch_run_id}" =~ ^[1-9][0-9]*$ ]]; then
              dispatch_run_id=''
            fi

            if [[ -z "${dispatch_run_id}" ]]; then
              # The workflow-scoped list is capped at 100; an incomplete result
              # is uncertainty, not evidence of uniqueness. Retry only reads.
              for attempt in 1 2 3 4 5 6; do
                if runs=$(timeout 10s gh api --method GET \
                  "repos/${REPOSITORY}/actions/workflows/ci.yml/runs" \
                  -f branch=main -f event=workflow_dispatch -f per_page=100 \
                  -f "created=>=${created_since}" 2>/dev/null) &&
                  candidates=$(jq -sc --arg sha "${landed_sha}" --arg repo "${REPOSITORY}" \
                    --argjson workflow "${workflow_id}" --argjson start "${window_start}" \
                    --argjson end "${window_end}" '
                      if length != 1 then error("invalid run listing") else .[0] end
                      |
                      if (.workflow_runs | type) != "array" or
                         (.total_count | type) != "number" or
                         .total_count != (.workflow_runs | length) or .total_count > 100
                      then error("incomplete run listing") else .workflow_runs end
                      | map(if type == "object" and
                          (.id | type == "number" and . > 0 and floor == .) and
                          (.workflow_id | type == "number") and
                          (.repository.full_name | type == "string") and
                          (.head_repository.full_name | type == "string") and
                          (.event | type == "string") and (.head_branch | type == "string") and
                          (.head_sha | type == "string") and (.created_at | type == "string")
                        then . else error("malformed run") end)
                      | [ .[] | select(.workflow_id == $workflow and
                          .repository.full_name == $repo and .head_repository.full_name == $repo and
                          .event == "workflow_dispatch" and .head_branch == "main" and .head_sha == $sha)
                        | select((.created_at | fromdateiso8601) >= $start and
                                 (.created_at | fromdateiso8601) <= $end)
                        | .id ]
                    ' <<<"${runs}" 2>/dev/null); then
                  candidate_count=$(jq -r 'length' <<<"${candidates}")
                  if [[ "${candidate_count}" == '1' ]]; then
                    dispatch_run_id=$(jq -r '.[0] | tostring' <<<"${candidates}")
                    [[ "${dispatch_run_id}" =~ ^[1-9][0-9]*$ ]] || exit 1
                    break
                  elif [[ "${candidate_count}" != '0' ]]; then
                    echo 'Cannot reconcile dispatch: multiple matching CI runs.' >&2
                    exit 1
                  fi
                fi
                if [[ "${attempt}" != '6' ]]; then sleep 2; fi
              done
              if [[ -z "${dispatch_run_id}" ]]; then
                echo 'Cannot reconcile dispatch: no unique visible CI run.' >&2
                exit 1
              fi
            fi

            # An ID is only a hint until a separate GET proves its full identity.
            dispatch_run=''
            for attempt in 1 2 3 4 5 6; do
              if dispatch_run=$(timeout 10s gh api "repos/${REPOSITORY}/actions/runs/${dispatch_run_id}" 2>/dev/null) &&
                jq -se 'length == 1 and (.[0] |
                  type == "object" and (.id | type == "number") and
                  (.workflow_id | type == "number") and (.path | type == "string") and
                  (.repository.full_name | type == "string") and
                  (.head_repository.full_name | type == "string") and
                  (.event | type == "string") and (.head_branch | type == "string") and
                  (.head_sha | type == "string") and (.created_at | type == "string"))
                ' <<<"${dispatch_run}" >/dev/null 2>&1; then
                break
              fi
              dispatch_run=''
              if [[ "${attempt}" != '6' ]]; then sleep 2; fi
            done
            if [[ -z "${dispatch_run}" ]]; then
              echo 'Cannot read back the dispatched CI run.' >&2
              exit 1
            fi
            if ! jq -se --arg id "${dispatch_run_id}" --arg sha "${landed_sha}" \
              --arg repo "${REPOSITORY}" --argjson workflow "${workflow_id}" \
              --argjson start "${window_start}" --argjson end "${window_end}" '
                length == 1 and (.[0] |
                (.id | tostring) == $id and .workflow_id == $workflow and
                (.path == ".github/workflows/ci.yml" or .path == ".github/workflows/ci.yml@main") and
                .repository.full_name == $repo and .head_repository.full_name == $repo and
                .event == "workflow_dispatch" and .head_branch == "main" and .head_sha == $sha and
                ((.created_at | fromdateiso8601) >= $start) and
                ((.created_at | fromdateiso8601) <= $end))
              ' <<<"${dispatch_run}" >/dev/null 2>&1; then
              echo 'Dispatched CI run does not match the expected identity; no run was cancelled.' >&2
              exit 1
            fi
            echo "Dispatched full CI run ${dispatch_run_id} for landed main revision ${landed_sha}."
          else
            echo "Main advanced from ${landed_sha} to ${main_sha}; the newer revision needs separate CI evidence."
          fi
