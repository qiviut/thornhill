name: Scheduled fuzzing

on:
  schedule:
    - cron: '17 3 * * 0'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scheduled-fuzzing
  cancel-in-progress: true

jobs:
  fuzz:
    name: Authority and protocol fuzzing
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Fuzz authority and protocol boundaries
        env:
          FUZZTIME: 2m
        run: scripts/test-fuzz.sh

      - name: Preserve minimized failure corpora
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-failures-${{ github.run_id }}
          path: '**/testdata/fuzz/**'
          if-no-files-found: ignore
          retention-days: 14
