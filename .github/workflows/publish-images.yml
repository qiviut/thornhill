name: Publish trusted images

# Qualification CI builds and tests the final images without package-write
# authority. This trusted post-main lane loads those exact archives from the
# source run, reruns runtime checks, and publishes them without rebuilding.
# It never runs for pull-request CI.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]

concurrency:
  group: trusted-image-publish-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  publish:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      actions: read
      contents: read
      packages: write
    steps:
      - name: Verify the source run is protected main CI
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          source_run=$(gh api "repos/${REPOSITORY}/actions/runs/${WORKFLOW_RUN_ID}")
          event=$(jq -r '.event' <<<"${source_run}")
          source_repository=$(jq -r '.head_repository.full_name // empty' <<<"${source_run}")
          head_branch=$(jq -r '.head_branch // empty' <<<"${source_run}")
          head_sha=$(jq -r '.head_sha // empty' <<<"${source_run}")
          main_sha=$(gh api "repos/${REPOSITORY}/git/ref/heads/main" --jq '.object.sha')
          [[ "${event}" == push || "${event}" == workflow_dispatch ]]
          [[ "${source_repository}" == "${REPOSITORY}" ]]
          [[ "${head_branch}" == main ]]
          [[ "${head_sha}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${head_sha}" == "${main_sha}" ]]
          printf 'sha=%s\n' "${head_sha}" >>"${GITHUB_OUTPUT}"
          printf 'run_url=%s\n' "$(jq -r '.html_url' <<<"${source_run}")" >>"${GITHUB_OUTPUT}"

      - name: Check out the exact qualified revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.source.outputs.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Download exact qualified image artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: thornhill-images-${{ steps.source.outputs.sha }}
          path: ${{ runner.temp }}/thornhill-images
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Load and verify exact qualified images
        env:
          REVISION: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          artifact_dir="${RUNNER_TEMP}/thornhill-images"
          jq -e --arg expected "${REVISION}" '
            .version == 1 and .source_commit == $expected and
            .images.app.archive == "app.tar.gz" and
            .images.app.local_tag == "thornhill:ci" and
            .images.postgres.archive == "postgres.tar.gz" and
            .images.postgres.local_tag == "thornhill-postgres:ci" and
            (.images.app.id | test("^sha256:[0-9a-f]{64}$")) and
            (.images.postgres.id | test("^sha256:[0-9a-f]{64}$")) and
            .images.app.revision == $expected and
            .images.postgres.revision == $expected
          ' "${artifact_dir}/manifest.json" >/dev/null
          test -s "${artifact_dir}/app.tar.gz"
          test -s "${artifact_dir}/postgres.tar.gz"
          gzip -dc "${artifact_dir}/app.tar.gz" | docker load
          gzip -dc "${artifact_dir}/postgres.tar.gz" | docker load
          app_id=$(docker image inspect thornhill:ci --format '{{.Id}}')
          db_id=$(docker image inspect thornhill-postgres:ci --format '{{.Id}}')
          expected_app_id=$(jq -r .images.app.id "${artifact_dir}/manifest.json")
          expected_db_id=$(jq -r .images.postgres.id "${artifact_dir}/manifest.json")
          [[ "${app_id}" == "${expected_app_id}" ]]
          [[ "${db_id}" == "${expected_db_id}" ]]
          docker tag thornhill:ci "ghcr.io/${GITHUB_REPOSITORY}-app:${REVISION}"
          docker tag thornhill-postgres:ci "ghcr.io/${GITHUB_REPOSITORY}-postgres:${REVISION}"
          app_label=$(docker image inspect "ghcr.io/${GITHUB_REPOSITORY}-app:${REVISION}" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')
          db_label=$(docker image inspect "ghcr.io/${GITHUB_REPOSITORY}-postgres:${REVISION}" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')
          [[ "${app_label}" == "${REVISION}" && "${db_label}" == "${REVISION}" ]]
          [[ "$(docker run --rm "ghcr.io/${GITHUB_REPOSITORY}-app:${REVISION}" --version)" == "thornhill ${REVISION}" ]]

      - name: Re-run final-image runtime qualification
        env:
          APP_IMAGE: ghcr.io/${{ github.repository }}-app:${{ steps.source.outputs.sha }}
          DB_IMAGE: ghcr.io/${{ github.repository }}-postgres:${{ steps.source.outputs.sha }}
        run: scripts/test-container-hardening.sh "${APP_IMAGE}" "${DB_IMAGE}"

      - name: Log in to the trusted GitHub Container Registry
        env:
          GH_TOKEN: ${{ github.token }}
        run: printf '%s' "${GH_TOKEN}" | docker login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin

      - name: Publish immutable full-SHA image tags
        env:
          APP_IMAGE: ghcr.io/${{ github.repository }}-app:${{ steps.source.outputs.sha }}
          DB_IMAGE: ghcr.io/${{ github.repository }}-postgres:${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          docker push "${APP_IMAGE}"
          docker push "${DB_IMAGE}"

      - name: Record immutable image references
        env:
          REVISION: ${{ steps.source.outputs.sha }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_RUN_URL: ${{ steps.source.outputs.run_url }}
          APP_REPOSITORY: ghcr.io/${{ github.repository }}-app
          DB_REPOSITORY: ghcr.io/${{ github.repository }}-postgres
        run: |
          set -euo pipefail
          app_ref=$(docker image inspect "${APP_REPOSITORY}:${REVISION}" --format '{{json .RepoDigests}}' | jq -er --arg repo "${APP_REPOSITORY}" '[.[] | select(startswith($repo + "@"))][0]')
          db_ref=$(docker image inspect "${DB_REPOSITORY}:${REVISION}" --format '{{json .RepoDigests}}' | jq -er --arg repo "${DB_REPOSITORY}" '[.[] | select(startswith($repo + "@"))][0]')
          jq -n \
            --arg source_commit "${REVISION}" \
            --arg source_run_id "${SOURCE_RUN_ID}" \
            --arg source_run_url "${SOURCE_RUN_URL}" \
            --arg app_image "${app_ref}" \
            --arg db_image "${db_ref}" \
            '{version:2,source_commit:$source_commit,source_run_id:($source_run_id|tonumber),source_run_url:$source_run_url,app_image:$app_image,db_image:$db_image}' \
            >"${RUNNER_TEMP}/thornhill-image-manifest.json"
          jq -e --arg expected "${REVISION}" '
            .version == 2 and .source_commit == $expected and
            (.app_image | test("^ghcr\\.io/.+@sha256:[0-9a-f]{64}$")) and
            (.db_image | test("^ghcr\\.io/.+@sha256:[0-9a-f]{64}$"))
          ' "${RUNNER_TEMP}/thornhill-image-manifest.json" >/dev/null

      - name: Preserve immutable image manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: thornhill-image-manifest-${{ steps.source.outputs.sha }}
          path: ${{ runner.temp }}/thornhill-image-manifest.json
          if-no-files-found: error
          retention-days: 90
