name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact protected-main revision this run must qualify
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

env:
  GIT_CONFIG_COUNT: 1
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

concurrency:
  # Keep normal pushes convergent while isolating exact-SHA dispatches. A stale
  # dispatch must never cancel newer push CI before its SHA mismatch is rejected.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}-${{ inputs.expected_sha || '' }}
  cancel-in-progress: true

jobs:
  # This lane keeps the historical secret scan and branch-policy check ahead of
  # every command that evaluates checkout content. Its toolchain outputs avoid
  # version drift between the independent source qualification lane and images.
  preflight:
    name: History and policy preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      go: ${{ steps.toolchains.outputs.go }}
      node: ${{ steps.toolchains.outputs.node }}
    steps:
      - name: Verify dispatched protected-main revision
        if: github.event_name == 'workflow_dispatch'
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          [[ "${GITHUB_REF}" == 'refs/heads/main' ]]
          [[ "${EXPECTED_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${GITHUB_SHA}" == "${EXPECTED_SHA}" ]]

      - name: Check out source and history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Scan Git history for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Verify branch-protection readiness
        run: scripts/check-ci-policy.sh

      - name: Resolve container toolchains
        id: toolchains
        shell: bash
        run: |
          set -euo pipefail
          go_image=$(awk '$1 == "FROM" && $2 ~ /^golang:/ { print $2; exit }' Dockerfile)
          node_image=$(awk '$1 == "FROM" && $2 ~ /^node:/ { print $2; exit }' Dockerfile)
          go_image=${go_image%@sha256:*}
          node_image=${node_image%@sha256:*}
          go_version=${go_image#golang:}
          go_version=${go_version%-alpine}
          node_version=${node_image#node:}
          node_version=${node_version%-alpine}
          test -n "${go_version}" && test -n "${node_version}"
          printf 'go=%s\nnode=%s\n' "${go_version}" "${node_version}" >> "${GITHUB_OUTPUT}"

  source:
    name: Source analysis and fuzzing
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ needs.preflight.outputs.go }}
          # Do not restore mutable caches into the untrusted qualification lane.
          cache: false

      - name: Check Go formatting and workflows
        run: |
          test -z "$(gofmt -l .)"
          go tool actionlint .github/workflows/*.yml

      - name: Run automated high-risk review matrix
        env:
          RISK_REVIEW_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
          RISK_REVIEW_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          mkdir -p "${RUNNER_TEMP}/coverage"
          python3 scripts/high-risk-review.py \
            --base "${RISK_REVIEW_BASE_SHA}" \
            --head "${RISK_REVIEW_HEAD_SHA}" \
            --report "${RUNNER_TEMP}/coverage/high-risk-review.json"

      - name: Analyze and test Go
        run: |
          go vet ./...
          go tool staticcheck ./...
          go tool govulncheck ./...
          mkdir -p "${RUNNER_TEMP}/coverage"
          go test -race -covermode=atomic \
            -coverprofile="${RUNNER_TEMP}/coverage/go.out" ./...
          go tool cover -func="${RUNNER_TEMP}/coverage/go.out" \
            >"${RUNNER_TEMP}/coverage/go.txt"
          python3 scripts/check-coverage.py \
            --profile "${RUNNER_TEMP}/coverage/go.out" \
            --require thornhill/internal/bridge=75

      - name: Test fail-closed deployer policy
        run: scripts/test-deployer-policy.sh

      - name: Test restart-safe credential transition recovery
        run: scripts/test-deployer-transition-recovery.sh

      - name: Fuzz authority and protocol boundaries
        env:
          FUZZTIME: 5s
        run: scripts/test-fuzz.sh

      - name: Test ephemeral dummy model provider
        run: go test -tags=integration -count=1 -run '^TestProviderProcessConformance$' ./internal/dummyopenai

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Deliberately omit `cache` in the public-PR qualification lane.
          node-version: ${{ needs.preflight.outputs.node }}

      - name: Verify web client
        working-directory: web
        run: |
          npm ci --ignore-scripts
          npm run check
          npm run lint
          npm test
          npm run build
          npm audit --audit-level=high

      - name: Preserve Go coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: thornhill-coverage-${{ github.sha }}
          path: ${{ runner.temp }}/coverage/
          if-no-files-found: ignore
          retention-days: 30

  image:
    name: Image build and security
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate Dockerfiles with BuildKit
        run: |
          docker buildx version
          docker buildx build --check .
          docker buildx build --check --file Dockerfile.postgres .

      - name: Build application image
        run: |
          docker buildx build --pull --load \
            --build-arg "THORNHILL_REVISION=${GITHUB_SHA}" \
            --build-arg "THORNHILL_SOURCE=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --tag thornhill:ci .
          revision_label=$(docker image inspect thornhill:ci --format='{{ index .Config.Labels "org.opencontainers.image.revision" }}')
          test "${revision_label}" = "${GITHUB_SHA}"
          test "$(docker run --rm thornhill:ci --version)" = "thornhill ${GITHUB_SHA}"

      - name: Build PostgreSQL image
        # Dockerfile.postgres deliberately refreshes Alpine security packages;
        # bypass a stale cached `apk upgrade` layer so the scan covers today's
        # repository fixes rather than only the pinned upstream base.
        run: |
          docker buildx build --pull --no-cache --load \
            --build-arg "THORNHILL_REVISION=${GITHUB_SHA}" \
            --build-arg "THORNHILL_SOURCE=https://github.com/${GITHUB_REPOSITORY}" \
            --file Dockerfile.postgres --tag thornhill-postgres:ci .

      - name: Test container health and runtime hardening
        run: scripts/test-container-hardening.sh thornhill:ci thornhill-postgres:ci

      - name: Test randomized PostgreSQL migrations and approval claims
        env:
          THORNHILL_COVERAGE_DIR: ${{ runner.temp }}/coverage
        run: scripts/test-postgres-integration.sh

      - name: Check integration coverage for River ownership
        run: |
          python3 scripts/check-coverage.py \
            --profile "${RUNNER_TEMP}/coverage/dispatch.out" \
            --require thornhill/internal/dispatch/queue_river.go=35

      - name: Test bounded local database recovery
        run: scripts/test-local-recovery.sh

      - name: Validate Compose model
        run: |
          compose_password=$(printf '%064d' 0)
          THORNHILL_DB_PASSWORD="${compose_password}" \
            THORNHILL_ENV_FILE=.env.example docker compose config --quiet
          SCANNER_UID=$(id -u) SCANNER_GID=$(id -g) \
            docker compose --file .github/scanners/compose.yml --project-directory . config --quiet

      - name: Scan source, configuration, and final images
        env:
          SCAN_OUTPUT_DIR: ${{ runner.temp }}/thornhill-scan
          TRIVY_CACHE_DIR: ${{ runner.temp }}/trivy-cache
        run: scripts/run-security-scans.sh thornhill:ci thornhill-postgres:ci

      # Export the exact images that passed every image/runtime/security gate.
      # The privileged workflow_run publisher loads these archives; it never
      # rebuilds a supposedly qualified revision.
      - name: Export qualified image artifacts
        run: |
          set -euo pipefail
          artifact_dir="${RUNNER_TEMP}/thornhill-images"
          mkdir -p "${artifact_dir}"
          docker save thornhill:ci | gzip -1 >"${artifact_dir}/app.tar.gz"
          docker save thornhill-postgres:ci | gzip -1 >"${artifact_dir}/postgres.tar.gz"
          app_revision=$(docker image inspect thornhill:ci --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')
          db_revision=$(docker image inspect thornhill-postgres:ci --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')
          app_id=$(docker image inspect thornhill:ci --format '{{.Id}}')
          db_id=$(docker image inspect thornhill-postgres:ci --format '{{.Id}}')
          jq -n \
            --arg source_commit "${GITHUB_SHA}" \
            --arg app_revision "${app_revision}" \
            --arg db_revision "${db_revision}" \
            --arg app_id "${app_id}" \
            --arg db_id "${db_id}" \
            '{version:1,source_commit:$source_commit,images:{app:{archive:"app.tar.gz",local_tag:"thornhill:ci",id:$app_id,revision:$app_revision},postgres:{archive:"postgres.tar.gz",local_tag:"thornhill-postgres:ci",id:$db_id,revision:$db_revision}}}' \
            >"${artifact_dir}/manifest.json"
          jq -e --arg expected "${GITHUB_SHA}" '
            .version == 1 and .source_commit == $expected and
            .images.app.revision == $expected and
            .images.postgres.revision == $expected
          ' "${artifact_dir}/manifest.json" >/dev/null

      - name: Preserve qualified image artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: thornhill-images-${{ github.sha }}
          path: ${{ runner.temp }}/thornhill-images/
          if-no-files-found: error
          retention-days: 90

      - name: Preserve CycloneDX SBOMs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: thornhill-sboms-${{ github.sha }}
          path: ${{ runner.temp }}/thornhill-scan/*.cdx.json
          if-no-files-found: warn
          retention-days: 30

      - name: Preserve integration coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: thornhill-dispatch-coverage-${{ github.sha }}
          path: ${{ runner.temp }}/coverage/
          if-no-files-found: ignore
          retention-days: 30

  # Keep this exact check name: branch protection and the CI-gated deployer use
  # it as the single green gate. It intentionally carries no untrusted code.
  verify:
    name: Go, web, and image build
    needs: [source, image]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every qualification lane to pass
        run: |
          test "${{ needs.source.result }}" = success
          test "${{ needs.image.result }}" = success
